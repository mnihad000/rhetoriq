services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rhetoriq}
      POSTGRES_USER: ${POSTGRES_USER:-rhetoriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  broker:
    image: apache/kafka:4.3.1
    hostname: broker
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  schema-registry:
    image: quay.io/apicurio/apicurio-registry:3.3.0
    restart: unless-stopped
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24

  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:2026.7.26-b060c780d@sha256:d0aaeb14880e6e92bde1518fcc7261e995783367d63d95203383607bef9c6516}
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    volumes:
      - ./infra/research/searxng-settings.yml:/etc/searxng/settings.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8000
      DEPLOYMENT_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhetoriq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rhetoriq}
      DEMO_MODE: "false"
      RESEARCH_RUNTIME: langgraph
      RESEARCH_EXECUTION_MODE: kafka
      SEARXNG_BASE_URL: http://searxng:8080
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      BROWSER_RENDERING_ENABLED: "false"
      CORS_ALLOW_ORIGINS: http://localhost:4173
      REQUEST_RATE_LIMIT_PER_MINUTE: ${REQUEST_RATE_LIMIT_PER_MINUTE:-120}
      INVESTIGATION_START_LIMIT_PER_HOUR: ${INVESTIGATION_START_LIMIT_PER_HOUR:-5}
      REQUEST_RATE_LIMIT_MAX_CLIENTS: ${REQUEST_RATE_LIMIT_MAX_CLIENTS:-10000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      topic-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  topic-init:
    build: ./backend
    restart: "no"
    command: ["python", "-m", "events.topics"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhetoriq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rhetoriq}
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  outbox-publisher:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "services.kafka_runtime"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhetoriq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rhetoriq}
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_CLIENT_ID: rhetoriq-outbox
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully

  document-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "events.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhetoriq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rhetoriq}
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_CLIENT_ID: rhetoriq-document-worker
      KAFKA_WORKER_ROLE: documents
      ENABLE_POSTGRES_VECTOR_SEARCH: ${ENABLE_POSTGRES_VECTOR_SEARCH:-false}
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully

  signal-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "events.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhetoriq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rhetoriq}
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_CLIENT_ID: rhetoriq-signal-worker
      KAFKA_WORKER_ROLE: signals
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully

  investigation-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "events.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhetoriq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rhetoriq}
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_CLIENT_ID: rhetoriq-investigation-worker
      KAFKA_WORKER_ROLE: investigations
      DEMO_MODE: "false"
      RESEARCH_RUNTIME: langgraph
      SEARXNG_BASE_URL: http://searxng:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      topic-init:
        condition: service_completed_successfully

  projection-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "events.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhetoriq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rhetoriq}
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_CLIENT_ID: rhetoriq-projection-worker
      KAFKA_WORKER_ROLE: projections
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PUBLIC_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "4173:80"

volumes:
  postgres-data:
  kafka-data:
