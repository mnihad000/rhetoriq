services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rhetoriq}
      POSTGRES_USER: ${POSTGRES_USER:-rhetoriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:2026.7.26-b060c780d@sha256:d0aaeb14880e6e92bde1518fcc7261e995783367d63d95203383607bef9c6516}
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    volumes:
      - ./infra/research/searxng-settings.yml:/etc/searxng/settings.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8000
      DEPLOYMENT_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhetoriq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rhetoriq}
      DEMO_MODE: "false"
      RESEARCH_RUNTIME: langgraph
      RESEARCH_EXECUTION_MODE: embedded
      SEARXNG_BASE_URL: http://searxng:8080
      BROWSER_RENDERING_ENABLED: "false"
      CORS_ALLOW_ORIGINS: http://localhost:4173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PUBLIC_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "4173:80"

volumes:
  postgres-data:
