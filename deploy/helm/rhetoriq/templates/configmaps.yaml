apiVersion: v1
kind: ConfigMap
metadata:
  name: rhetoriq-release
  namespace: {{ .Release.Namespace }}
data:
  release-identity: {{ .Values.global.releaseIdentity | quote }}
  chart-version: {{ .Chart.Version | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: {{ .Release.Namespace }}
data:
  settings.yml: |
    use_default_settings: true
    server:
      bind_address: "0.0.0.0"
      port: 8080
    search:
      safe_search: 1
      formats: [html, json]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-config
  namespace: {{ .Release.Namespace }}
data:
  flink-properties: |
    jobmanager.rpc.address: flink-jobmanager
    rest.bind-address: 0.0.0.0
    taskmanager.numberOfTaskSlots: 2
    parallelism.default: 1
    jobmanager.memory.process.size: {{ if eq .Values.global.releaseIdentity "kind" }}512m{{ else }}1024m{{ end }}
    taskmanager.memory.process.size: {{ if eq .Values.global.releaseIdentity "kind" }}768m{{ else }}2048m{{ end }}
    execution.checkpointing.interval: 60s
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    state.checkpoints.dir: file:///opt/flink/checkpoints
    state.savepoints.dir: file:///opt/flink/savepoints
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: 10
    restart-strategy.fixed-delay.delay: 10s
    python.executable: /usr/local/bin/python3.12
    python.client.executable: /usr/local/bin/python3.12
