{{- range $name, $ports := dict "postgres" (list 5432) "kafka" (list 19092 29093) "apicurio" (list 8080 9000) "searxng" (list 8080) "api" (list 8000) "frontend" (list 80) "flink-jobmanager" (list 8081 6123) "elasticsearch" (list 9200 9300) "neo4j" (list 7687) "redis" (list 6379) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rhetoriq.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rhetoriq
    app.kubernetes.io/component: {{ $name }}
  ports:
  {{- range $port := $ports }}
    - {name: p{{ $port }}, port: {{ $port }}, targetPort: {{ if and (eq $name "frontend") (eq $port 80) }}8080{{ else }}{{ $port }}{{ end }}}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: rhetoriq, app.kubernetes.io/component: kafka}
  ports: [{name: broker, port: 19092}, {name: controller, port: 29093}]
