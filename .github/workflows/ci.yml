name: CI

on:
  # Manual during runtime migration; enable branch automation before release.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: rhetoriq_test
          POSTGRES_USER: rhetoriq
          POSTGRES_PASSWORD: rhetoriq_test
        options: >-
          --health-cmd "pg_isready -U rhetoriq -d rhetoriq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql://rhetoriq:rhetoriq_test@localhost:5432/rhetoriq_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pytest tests -m "not integration"
      - run: pytest tests/test_postgres_migration.py
      - run: pytest tests/test_research_stream_postgres.py
      - run: pytest tests/test_b5_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "! rg -n '<<<<<<<|=======|>>>>>>>' --glob '*.md'"
      - name: Validate local topology without loading developer dotenv
        run: docker compose --env-file .env.production.example config --quiet
      - name: Validate B5 encrypted topology without developer dotenv
        run: docker compose --env-file .env.production.example -f compose.yml -f infra/b5/compose.b5.yml --profile b5 config --quiet
      - name: Validate disposable B5 acceptance topology
        run: docker compose --env-file .env.production.example -f compose.yml -f infra/b5/compose.b5.yml -f infra/b5/compose.acceptance.yml --profile b5 --profile acceptance config --quiet

  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            file: backend/Dockerfile
            context: backend
          - name: b5
            file: infra/b5/Dockerfile
            context: .
          - name: frontend
            file: frontend/Dockerfile
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          tags: rhetoriq/${{ matrix.name }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Verify immutable Linux/AMD64 identity
        shell: bash
        run: |
          test "$(docker image inspect rhetoriq/${{ matrix.name }}:ci --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          image_id="$(docker image inspect rhetoriq/${{ matrix.name }}:ci --format '{{.Id}}')"
          test "${image_id#sha256:}" != "$image_id"
          echo "${{ matrix.name }}=${image_id}"

