name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: rhetoriq_test
          POSTGRES_USER: rhetoriq
          POSTGRES_PASSWORD: rhetoriq_test
        options: >-
          --health-cmd "pg_isready -U rhetoriq -d rhetoriq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql://rhetoriq:rhetoriq_test@localhost:5432/rhetoriq_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m events.export_schemas --check
      - run: pytest tests -m "not integration"
      - run: pytest tests/test_postgres_migration.py
      - run: pytest tests/test_research_stream_postgres.py
      - run: pytest tests/test_b4_postgres.py
      - run: pytest tests/test_b5_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "! rg -n '<<<<<<<|=======|>>>>>>>' --glob '*.md'"
      - name: Validate local topology without loading developer dotenv
        run: docker compose --env-file .env.production.example config --quiet
      - name: Validate B5 encrypted topology without developer dotenv
        run: docker compose --env-file .env.production.example -f compose.yml -f infra/b5/compose.b5.yml --profile b5 config --quiet
      - name: Validate disposable B5 acceptance topology
        run: docker compose --env-file .env.production.example -f compose.yml -f infra/b5/compose.b5.yml -f infra/b5/compose.acceptance.yml --profile b5 --profile acceptance config --quiet

  flink-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: rhetoriq_b4_ci
      COMPOSE_FILE: compose.yml:infra/flink/compose.acceptance.yml
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Python 3.12 and connector candidate
        run: docker compose --env-file .env.production.example build flink-jobmanager enrichment-worker
      - name: Start disposable recorded-provider topology
        run: >-
          docker compose --env-file .env.production.example up -d
          flink-jobmanager flink-taskmanager enrichment-worker document-worker
          signal-worker projection-worker
      - name: Verify real Kafka delivery through both Flink branches
        run: >-
          docker compose --env-file .env.production.example run --rm --no-deps
          enrichment-worker python -m events.b4_acceptance --disposable-stack
      - name: Probe delivery across TaskManager and JobManager failure
        run: |
          docker compose --env-file .env.production.example run --rm --no-deps enrichment-worker python -m events.b4_acceptance --disposable-stack --drain-seconds 360 > recovery.json &
          probe=$!
          sleep 75
          docker compose --env-file .env.production.example kill -s SIGKILL flink-taskmanager
          docker compose --env-file .env.production.example up -d flink-taskmanager
          sleep 15
          docker compose --env-file .env.production.example kill -s SIGKILL flink-jobmanager
          docker compose --env-file .env.production.example up -d flink-jobmanager
          wait "$probe"
          cat recovery.json
      - name: Capture runtime evidence
        if: always()
        run: docker compose --env-file .env.production.example logs --no-color > b4-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b4-runtime-evidence
          path: |
            b4-runtime.log
            recovery.json
      - name: Stop disposable topology
        if: always()
        run: docker compose --env-file .env.production.example down
