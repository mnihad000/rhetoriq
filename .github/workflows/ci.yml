name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rhetoriq_test
          POSTGRES_USER: rhetoriq
          POSTGRES_PASSWORD: rhetoriq_test
        options: >-
          --health-cmd "pg_isready -U rhetoriq -d rhetoriq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql://rhetoriq:rhetoriq_test@localhost:5432/rhetoriq_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pytest tests -m "not integration"
      - run: pytest tests/test_postgres_migration.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "! rg -n '<<<<<<<|=======|>>>>>>>' --glob '*.md'"
